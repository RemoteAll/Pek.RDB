[package]
name = "bench-vs-sqlite"
version = "0.1.0"
edition = "2021"
description = "Pek.RDB 语言/引擎对比基准（SQLite 侧）。独立工具，不进引擎依赖树。"

[dependencies]
# 对照基线：与 Pek.RCode 同版本（bundled = 编译内置 SQLite，C 依赖只出现在本工具）
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
